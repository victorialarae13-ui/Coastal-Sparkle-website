
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Cleaning - Coastal Sparkle</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cormorant Garamond', serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5ede0 0%, #fef9f3 100%);
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            color: #062b5b;
            margin-bottom: 8px;
            font-family: 'Great Vibes', cursive;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 18px;
            color: #c4936f;
            letter-spacing: 1px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(6, 43, 91, 0.08);
            margin-bottom: 40px;
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .confirmation {
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(6, 43, 91, 0.08);
            display: none;
        }

        .confirmation.active {
            display: block;
        }

        .checkmark {
            font-size: 60px;
            color: #c4936f;
            margin-bottom: 20px;
        }

        .confirmation h2 {
            font-size: 32px;
            font-weight: 700;
            color: #062b5b;
            margin-bottom: 16px;
        }

        .confirmation p {
            font-size: 16px;
            color: #666;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-row div {
            flex: 1;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #062b5b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #f0e6d8;
            border-radius: 8px;
            font-family: 'Cormorant Garamond', serif;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #c4936f;
            background-color: #fefaf5;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #c4936f;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #062b5b 0%, #1a4d7f 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            font-family: 'Cormorant Garamond', serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 43, 91, 0.2);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .bookings-section {
            margin-top: 40px;
        }

        .bookings-title {
            font-size: 24px;
            font-weight: 600;
            color: #062b5b;
            margin-bottom: 20px;
        }

        .booking-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(6, 43, 91, 0.06);
            border-left: 4px solid #c4936f;
            margin-bottom: 16px;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .booking-name {
            font-size: 18px;
            font-weight: 600;
            color: #062b5b;
            margin: 0;
        }

        .service-tag {
            background: #f5ede0;
            color: #c4936f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .booking-detail {
            font-size: 14px;
            color: #666;
            margin: 6px 0;
            line-height: 1.5;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Book Your Cleaning</h1>
            <p>Coastal Sparkle Cleaning Service</p>
        </div>

        <!-- Form -->
        <div class="form-container active" id="formContainer">
            <form id="bookingForm">
                <!-- Name -->
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                    <div class="error-message" id="nameError">Please enter your name</div>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567" required>
                    <div class="error-message" id="phoneError">Please enter your phone number</div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com">
                </div>

                <!-- Service Type -->
                <div class="form-group">
                    <label for="serviceType">Service Type *</label>
                    <select id="serviceType" name="serviceType" required>
                        <option value="standard-cleaning">Standard Cleaning</option>
                        <option value="deep-cleaning">Deep Cleaning</option>
                        <option value="move-out">Move-Out Cleaning</option>
                        <option value="move-in">Move-In Cleaning</option>
                        <option value="post-event">Post-Event Cleaning</option>
                    </select>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label for="address">Service Address *</label>
                    <input type="text" id="address" name="address" placeholder="123 Main St, Your City, CA" required>
                    <div class="error-message" id="addressError">Please enter the service address</div>
                </div>

                <!-- Space Size -->
                <div class="form-group">
                    <label for="spaceSize">Space Size</label>
                    <select id="spaceSize" name="spaceSize">
                        <option value="small">Small (Studio/1BR)</option>
                        <option value="medium" selected>Medium (2-3BR)</option>
                        <option value="large">Large (4+ BR)</option>
                        <option value="commercial">Commercial</option>
                    </select>
                </div>

                <!-- Date & Time -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Preferred Date *</label>
                        <input type="date" id="date" name="date" required>
                        <div class="error-message" id="dateError">Please select a date</div>
                    </div>
                    <div class="form-group">
                        <label for="time">Preferred Time *</label>
                        <input type="time" id="time" name="time" required>
                        <div class="error-message" id="timeError">Please select a time</div>
                    </div>
                </div>

                <!-- Recurring -->
                <div class="checkbox-group">
                    <input type="checkbox" id="recurring" name="recurring">
                    <label for="recurring">I'd like regular, recurring cleanings</label>
                </div>

                <!-- Notes -->
                <div class="form-group">
                    <label for="notes">Special Requests or Notes</label>
                    <textarea id="notes" name="notes" placeholder="Any allergies, pet info, specific areas to focus on..."></textarea>
                </div>

                <button type="submit" id="submitBtn">Book Now</button>
            </form>
        </div>

        <!-- Confirmation -->
        <div class="confirmation" id="confirmationContainer">
            <div class="checkmark">✓</div>
            <h2>Booking Confirmed!</h2>
            <p id="confirmMessage">Thanks! We'll be in touch to confirm your appointment.</p>
        </div>

        <!-- Bookings List -->
        <div class="bookings-section" id="bookingsSection" style="display: none;">
            <h3 class="bookings-title">📋 Recent Bookings</h3>
            <div id="bookingsList"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('bookingForm');
        const formContainer = document.getElementById('formContainer');
        const confirmationContainer = document.getElementById('confirmationContainer');
        const bookingsSection = document.getElementById('bookingsSection');
        const bookingsList = document.getElementById('bookingsList');
        const submitBtn = document.getElementById('submitBtn');
        let bookings = [];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get form data
            const formData = new FormData(form);
            const data = {
                fullName: formData.get('fullName'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                serviceType: formData.get('serviceType'),
                address: formData.get('address'),
                spaceSize: formData.get('spaceSize'),
                date: formData.get('date'),
                time: formData.get('time'),
                recurring: formData.get('recurring') ? 'Yes' : 'No',
                notes: formData.get('notes')
            };

            // Validate required fields
            if (!data.fullName || !data.phone || !data.address || !data.date || !data.time) {
                alert('Please fill in all required fields');
                return;
            }

            // Disable button while submitting
            submitBtn.disabled = true;
            submitBtn.textContent = 'Booking...';

            try {
                // Submit to Formspree
                const response = await fetch('https://formspree.io/f/xnjyjzgg', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    },
                    body: formData
                });

                if (response.ok) {
                    // Add to bookings list
                    bookings.unshift({ ...data, id: Date.now() });
                    updateBookingsList();

                    // Show confirmation
                    document.getElementById('confirmMessage').textContent = 
                        `Thanks ${data.fullName}! We'll be in touch at ${data.phone} to confirm your appointment.`;
                    
                    formContainer.classList.remove('active');
                    confirmationContainer.classList.add('active');

                    // Reset form after 3 seconds
                    setTimeout(() => {
                        form.reset();
                        formContainer.classList.add('active');
                        confirmationContainer.classList.remove('active');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Book Now';
                    }, 3000);
                } else {
                    alert('There was an error submitting your booking. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Book Now';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('There was an error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Book Now';
            }
        });

        function updateBookingsList() {
            if (bookings.length === 0) {
                bookingsSection.style.display = 'none';
                return;
            }

            bookingsSection.style.display = 'block';
            bookingsList.innerHTML = bookings.map(booking => `
                <div class="booking-card">
                    <div class="booking-header">
                        <h4 class="booking-name">${booking.fullName}</h4>
                        <span class="service-tag">${booking.serviceType.replace('-', ' ')}</span>
                    </div>
                    <p class="booking-detail">📅 ${booking.date} at ${booking.time}</p>
                    <p class="booking-detail">📍 ${booking.address}</p>
                    <p class="booking-detail">📞 ${booking.phone}</p>
                    ${booking.email ? `<p class="booking-detail">✉️ ${booking.email}</p>` : ''}
                    ${booking.notes ? `<p class="booking-detail">📝 ${booking.notes}</p>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
